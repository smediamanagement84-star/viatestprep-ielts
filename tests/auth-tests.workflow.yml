name: Auth tests
on:
  push:
  pull_request:
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: npm test
        working-directory: tests
